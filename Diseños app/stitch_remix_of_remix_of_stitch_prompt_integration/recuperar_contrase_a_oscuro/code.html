    body {
      min-height: max(884px, 100dvh);

<body class="bg-slate-950 text-white font-body min-h-screen flex flex-col items-center justify-center p-6 antialiased selection:bg-primary-container selection:text-white">
<div class="w-full max-w-md relative z-10">
<!-- Back Button Context -->
<a aria-label="Volver" class="inline-flex items-center text-slate-400 hover:text-white transition-colors mb-8 group" href="#">
<span class="material-symbols-outlined mr-2 group-active:scale-95 transition-transform">arrow_back</span>
<span class="font-label font-semibold text-sm tracking-wide">Volver al inicio</span>
</a>
<!-- Logo / Brand Anchor -->
<div class="mb-10 text-left">
<h1 class="font-headline text-3xl font-bold tracking-tighter text-white">Pórtico</h1>
</div>
<!-- Hero Content Area -->
<div class="mb-12">
<h2 class="font-display text-[2.25rem] leading-tight font-bold tracking-[-0.02em] text-white mb-4">
                Recuperar <br/>
<span class="text-violet-500">Contraseña</span>
</h2>
<p class="font-body text-base text-slate-400 leading-[1.6]">
                Ingresa tu correo electrónico registrado y te enviaremos las instrucciones para recuperar el acceso a tu cuenta.
            </p>
</div>
<!-- Form Area -->
<form class="space-y-6">
<div class="space-y-2 relative group">
<label class="block font-label font-semibold text-xs tracking-wide text-slate-300 uppercase pl-4" for="email">
                    Correo electrónico
                </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-violet-500 transition-colors pointer-events-none">
                        mail
                    </span>
<input class="w-full bg-slate-900 border-none rounded-[14px] py-4 pl-12 pr-4 text-white placeholder-slate-600 focus:ring-1 focus:ring-violet-500 focus:bg-slate-800 transition-all font-body text-base outline-none shadow-inner" id="email" placeholder="ejemplo@correo.com" required="" type="email"/>
</div>
</div>
<!-- Action Area -->
<div class="pt-8">
<button class="w-full flex items-center justify-center bg-gradient-to-br from-[#5323E6] to-[#6C47FF] hover:opacity-90 active:scale-95 transition-all duration-200 rounded-full py-4 px-8 shadow-[0_12px_32px_rgba(108,71,255,0.15)] group" type="submit">
<span class="font-label font-bold text-white text-base tracking-wide">Enviar Instrucciones</span>
<span class="material-symbols-outlined ml-2 text-white/80 group-hover:translate-x-1 transition-transform">
                        send
                    </span>
</button>
</div>
</form>
</div>
<!-- Background Decoration (Ambient Depth) -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] bg-violet-900/10 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-violet-600/5 rounded-full blur-[120px]"></div>
</div>
