<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pórtico - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffdbcb",
                        "secondary-container": "#755fe5",
                        "on-error-container": "#93000a",
                        "primary-container": "#6c47ff",
                        "on-surface-variant": "#484556",
                        "on-surface": "#191c1f",
                        "surface-container": "#edeef3",
                        "primary": "#5323e6",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#e5deff",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "inverse-surface": "#2e3134",
                        "primary-fixed-dim": "#c9beff",
                        "on-tertiary-fixed": "#341100",
                        "on-primary-container": "#f1ebff",
                        "inverse-on-surface": "#eff0f5",
                        "on-primary": "#ffffff",
                        "background": "#f8f9fe",
                        "outline": "#797588",
                        "on-secondary-fixed": "#1a0063",
                        "on-secondary-container": "#fffbff",
                        "primary-fixed": "#e6deff",
                        "on-tertiary-container": "#ffeae1",
                        "on-primary-fixed": "#1b0063",
                        "tertiary": "#8d3b00",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f8f9fe",
                        "on-secondary-fixed-variant": "#462ab4",
                        "on-primary-fixed-variant": "#4500d8",
                        "surface-variant": "#e1e2e7",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb691",
                        "surface-tint": "#5e35f1",
                        "secondary": "#5c44ca",
                        "on-tertiary-fixed-variant": "#783100",
                        "secondary-fixed-dim": "#c9bfff",
                        "surface-container-highest": "#e1e2e7",
                        "surface-container-high": "#e7e8ed",
                        "on-background": "#191c1f",
                        "surface-dim": "#d8dadf",
                        "surface-bright": "#f8f9fe",
                        "tertiary-container": "#b34d00",
                        "surface-container-low": "#f2f3f8",
                        "outline-variant": "#c9c3d9",
                        "inverse-primary": "#c9beff"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            /* Forcing dark theme background for splash as requested */
            background-color: #0f172a; /* Deep navy/slate-900 equivalent */
        }
        /* Custom glow for the shield */
        .glow-shield {
            box-shadow: 0 0 60px rgba(108, 71, 255, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative font-display">
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center w-full h-full p-8">
<!-- Logo Element -->
<div class="relative flex flex-col items-center">
<!-- Shield Icon Container -->
<div class="w-32 h-32 rounded-[2rem] bg-gradient-to-br from-primary to-primary-container flex items-center justify-center glow-shield mb-8">
<span class="material-symbols-outlined text-[64px] text-white" style="font-variation-settings: 'FILL' 1;">
                    shield
                </span>
</div>
<!-- Brand Name -->
<h1 class="text-white text-5xl font-extrabold tracking-[-0.02em] font-headline">
                Pórtico
            </h1>
</div>
</main>
<!-- Bottom Loading Indicator -->
<div class="absolute bottom-16 left-0 right-0 flex justify-center items-center pb-8 z-20">
<div class="w-12 h-12 rounded-full border-4 border-slate-800 border-t-primary-container"></div>
</div>
</body></html>
