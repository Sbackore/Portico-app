<style>
    /* Base styles forcing dark mode appearance as requested */
    body {
        background-color: #0A0B1E;
        color: #ffffff;
    }
    .card-bg {
        background-color: #0F1022;
    }
    
    .premium-input {
        background-color: #1a1b2e !important;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        color: #ffffff !important;
        padding: 1rem 1.25rem 1rem 3rem;
        width: 100%;
        transition: all 0.3s ease;
    }
    
    .premium-input:focus {
        outline: none;
        border-color: theme('colors.primary-container');
        box-shadow: 0 0 0 1px theme('colors.primary-container');
    }
    
    .premium-input::placeholder {
        color: #64748b;
    }

    .input-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: #64748b;
        font-size: 1.25rem;
        pointer-events: none;
    }

    .input-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: #94a3b8;
        margin-bottom: 0.5rem;
        display: block;
    }

    .btn-primary {
        background: linear-gradient(135deg, theme('colors.primary'), theme('colors.primary-container'));
        border-radius: 9999px;
        color: white;
        font-weight: 600;
        padding: 1rem 2rem;
        width: 100%;
        border: none;
        cursor: pointer;
        transition: transform 0.2s ease;
    }
    
    .btn-primary:active {
        transform: scale(0.98);
    }

<style>

<body class="font-body antialiased min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed docked full-width top-0 z-40 bg-zinc-950/80 backdrop-blur-lg flex justify-between items-center w-full px-6 py-4 shadow-none no-border">

<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>

<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<main class="pt-28 px-6 max-w-md mx-auto flex flex-col gap-8">

<section class="flex flex-col items-center justify-center">
<div class="relative">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-[#0A0B1E] shadow-[0px_12px_32px_rgba(108,71,255,0.08)] bg-[#0F1022]">

</div>
<button class="absolute bottom-0 right-0 w-10 h-10 bg-primary-container rounded-full flex items-center justify-center text-white shadow-lg hover:scale-105 transition-transform active:scale-95 border-2 border-[#0A0B1E]">
<span class="material-symbols-outlined text-sm" data-icon="edit" data-weight="fill">edit</span>
</button>
</div>
<h2 class="mt-4 font-headline text-xl font-bold text-white">María Rodríguez</h2>
<p class="text-sm text-slate-400 mt-1">maria.rodriguez@email.com</p>
</section>
<!-- Form Fields -->
<form class="flex flex-col gap-6">
<div class="grid grid-cols-2 gap-4">
<div>
<label class="input-label">Nombres</label>
<div class="input-wrapper">
<span class="material-symbols-outlined input-icon" data-icon="person">person</span>
<input class="premium-input" type="text" value="María"/>
</div>
</div>
<div>
<label class="input-label">Apellidos</label>
<div class="input-wrapper">
<span class="material-symbols-outlined input-icon" data-icon="person">person</span>
<input class="premium-input" type="text" value="Rodríguez"/>
</div>
</div>
</div>
<div>
<label class="input-label">Número de celular</label>
<div class="input-wrapper">
<span class="material-symbols-outlined input-icon" data-icon="phone_iphone">phone_iphone</span>
<input class="premium-input" type="tel" value="300 123 4567"/>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="input-label">Fecha de nacimiento</label>
<div class="input-wrapper">
<span class="material-symbols-outlined input-icon" data-icon="calendar_today">calendar_today</span>
<input class="premium-input" type="text" value="15/08/1992"/>
</div>
</div>
<div>
<label class="input-label">Edad</label>
<div class="input-wrapper">
<span class="material-symbols-outlined input-icon" data-icon="cake">cake</span>
<input class="premium-input cursor-not-allowed" readonly="" type="text" value="31"/>
</div>
</div>
</div>
<div>
<label class="input-label">Número de documento</label>
<div class="input-wrapper">
<span class="material-symbols-outlined input-icon" data-icon="badge">badge</span>
<input class="premium-input" type="text" value="1.020.345.678"/>
</div>
</div>
<div>
<label class="input-label">Fecha de expedición del documento</label>
<div class="input-wrapper">
<span class="material-symbols-outlined input-icon" data-icon="calendar_month">calendar_month</span>
<input class="premium-input" type="text" value="20/09/2010"/>
</div>
</div>
<div>
<label class="input-label">Correo</label>
<div class="input-wrapper">
<span class="material-symbols-outlined input-icon" data-icon="mail">mail</span>
<input class="premium-input" type="email" value="maria.rodriguez@email.com"/>
</div>
</div>
<div class="pt-6 pb-8">
<button class="btn-primary" type="button">
                    Guardar Cambios

<span class="font-inter text-[11px] font-medium tracking-wide">Perfil</span>
